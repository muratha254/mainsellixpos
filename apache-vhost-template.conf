# ============================================================
# Apache VirtualHost Template for Laravel LAN Deployment
# ============================================================
# INSTRUCTIONS:
# 1. Copy this file content
# 2. Open: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# 3. Paste and customize the variables below
# 4. Replace all [PLACEHOLDERS] with actual values
# 5. Save and restart Apache
# ============================================================

<VirtualHost *:80>
    # ============================================================
    # SERVER CONFIGURATION
    # ============================================================
    # Replace [SERVER_IP] with your server's IP address
    # Find IP: Open CMD → ipconfig → Look for IPv4 Address
    # Example: 192.168.1.100 or 192.168.0.50
    # ============================================================
    ServerName [SERVER_IP]
    
    # Alternative: Use hostname if DNS is configured
    # ServerName [HOSTNAME].local
    # ServerAlias [SERVER_IP]
    
    # ============================================================
    # DOCUMENT ROOT
    # ============================================================
    # Replace [PROJECT_PATH] with full path to Laravel public folder
    # Use forward slashes (/) or escaped backslashes (\)
    # Example: C:/xampp/htdocs/myproject/public
    # ============================================================
    DocumentRoot "[PROJECT_PATH]/public"
    
    # ============================================================
    # DIRECTORY CONFIGURATION
    # ============================================================
    # Same path as DocumentRoot (without /public)
    # ============================================================
    <Directory "[PROJECT_PATH]/public">
        # Enable directory options
        Options Indexes FollowSymLinks
        
        # Enable .htaccess processing (REQUIRED for Laravel)
        AllowOverride All
        
        # Allow access from network (REQUIRED for LAN access)
        Require all granted
        
        # Enable URL rewriting (REQUIRED for Laravel routes)
        RewriteEngine On
        
        # Security: Prevent directory listing (optional but recommended)
        Options -Indexes
    </Directory>
    
    # ============================================================
    # LOGGING (Optional but Recommended)
    # ============================================================
    # Replace [PROJECT_NAME] with project identifier
    # Example: utamaduni, pos_system, etc.
    # ============================================================
    ErrorLog "C:/xampp/apache/logs/[PROJECT_NAME]_error.log"
    CustomLog "C:/xampp/apache/logs/[PROJECT_NAME]_access.log" common
    
    # Log level (optional)
    # LogLevel warn
    
    # ============================================================
    # PHP CONFIGURATION
    # ============================================================
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    
    # ============================================================
    # SECURITY HEADERS (Optional)
    # ============================================================
    # Uncomment to add security headers
    # Header set X-Content-Type-Options "nosniff"
    # Header set X-Frame-Options "SAMEORIGIN"
    # Header set X-XSS-Protection "1; mode=block"
</VirtualHost>

# ============================================================
# ALTERNATIVE: PORT 8080 CONFIGURATION
# ============================================================
# Use this if port 80 is already in use
# Uncomment and customize:
#
# <VirtualHost *:8080>
#     ServerName [SERVER_IP]:8080
#     DocumentRoot "[PROJECT_PATH]/public"
#     
#     <Directory "[PROJECT_PATH]/public">
#         Options Indexes FollowSymLinks
#         AllowOverride All
#         Require all granted
#         RewriteEngine On
#     </Directory>
#     
#     ErrorLog "C:/xampp/apache/logs/[PROJECT_NAME]_error.log"
#     CustomLog "C:/xampp/apache/logs/[PROJECT_NAME]_access.log" common
# </VirtualHost>
# ============================================================

