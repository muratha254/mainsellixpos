# Apache VirtualHost Configuration for Laravel Application
# For XAMPP on Windows
# 
# Location: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# 
# IMPORTANT: Replace the paths and IP address below with your actual values
# 
# 1. Update DocumentRoot to your Laravel public directory
# 2. Update ServerName with your server's IP address
# 3. Update Directory paths to match your installation
#
# INSTALL: Copy the <VirtualHost> block below into:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Put it as the FIRST VirtualHost so 192.168.100.64 uses it. Then restart Apache.

<VirtualHost *:80>
    # Server IP address (replace with your server's local IP)
    # Find your IP: Open CMD and run: ipconfig
    # Look for IPv4 Address under your active network adapter
    ServerName 192.168.1.200
    ServerAlias 192.168.1.200 localhost 127.0.0.1

    # DocumentRoot must point to Laravel's public directory (forward slashes)
    DocumentRoot "C:\xampp\htdocs\utamadunisystem/public"
    
    # Directory configuration for Laravel public folder
    <Directory "C:\xampp\htdocs\utamadunisystem/public">
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
        
        # Enable mod_rewrite
        RewriteEngine On
    </Directory>
    
    # Error and access logs (optional but recommended)
    ErrorLog "C:/xampp/apache/logs/utamaduni_error.log"
    CustomLog "C:/xampp/apache/logs/utamaduni_access.log" common
    
    # PHP configuration
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

# Alternative configuration if you want to use a port other than 80
# Uncomment and modify if needed (e.g., if port 80 is already in use)
